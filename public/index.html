<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨史·大明</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Menu Buttons -->
<div class="menu-btns">
  <button class="menu-btn" onclick="toggleMode()" title="切换模式" id="modeBtn">📝</button>
  <button class="menu-btn" onclick="openSaveModal()" title="存档">💾</button>
  <button class="menu-btn" onclick="openLoadModal()" title="读档">📖</button>
</div>

<!-- Save/Load Modal -->
<div class="modal-overlay" id="saveModal" onclick="closeModalOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">存 档</div>
    <div class="modal-subtitle" id="modalSubtitle">选择一个档位保存当前进度</div>
    <div id="modalSlots"></div>
    <button class="modal-close" onclick="closeModal()">关 闭</button>
  </div>
</div>

<!-- Floating Change Notifications -->
<div class="floating-changes" id="floatingChanges"></div>

<!-- Seal Watermark -->
<div class="seal-watermark">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="4" width="52" height="52" rx="4" stroke="#c0392b" stroke-width="3" fill="none"/>
    <text x="30" y="28" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="700" font-family="serif">墨史</text>
    <text x="30" y="46" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="700" font-family="serif">大明</text>
  </svg>
</div>

<div id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-title">墨史 · 大明</div>
    <div class="header-subtitle">洪武年间 · 文字冒险</div>
    <div class="header-line"></div>
  </header>

  <!-- Game Container -->
  <div id="gameContainer"></div>
</div>

<!-- Status Panel (fixed bottom) -->
<div class="status-panel" id="statusPanel">
  <div class="status-summary" id="statusSummary" onclick="toggleStatusPanel()">
    <div class="status-summary-left">
      <span id="statusYear">洪武八年</span>
      <span class="status-pacing-badge" id="statusPacing">📜 日常</span>
      <span id="statusPosition">未入流</span>
      <span id="statusCrisis" class="status-crisis-badge" style="display:none"></span>
    </div>
    <span class="status-toggle" id="statusToggle">▲</span>
  </div>
  <div class="status-detail" id="statusDetail">
    <!-- Attributes -->
    <div class="status-section">
      <div class="status-section-title">五 维 属 性</div>
      <div id="attrRows"></div>
    </div>
    <!-- Factions -->
    <div class="status-section">
      <div class="status-section-title">势 力 好 感</div>
      <div id="factionRows"></div>
    </div>
    <!-- v3.8.18: 伏笔区域（种子可见性） -->
    <div class="status-section" id="seedSection" style="display:none">
      <div class="status-section-title">伏 笔</div>
      <div id="seedHints"></div>
    </div>
    <!-- Emperor -->
    <div class="status-section">
      <div class="status-section-title">天 子 圣 眷</div>
      <div class="emperor-section">
        <span class="emperor-label">🐉 朱元璋</span>
        <div class="emperor-bar-wrap">
          <div class="emperor-bar-center"></div>
          <div class="emperor-bar-fill" id="emperorBar"></div>
        </div>
        <span class="emperor-value" id="emperorValue">0</span>
      </div>
    </div>
    <!-- P0-2: 危机详情 -->
    <div class="status-section" id="crisisDetailSection" style="display:none">
      <div class="status-section-title">危 机 详 情</div>
      <div id="crisisDetailContent"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/parser.js"></script>
<script src="js/game.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
