<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f0e8">
<meta name="description" content="墨史·大明 — 洪武年间文字冒险游戏">
<meta name="apple-mobile-web-app-title" content="墨史·大明">
<title>墨史 · 大明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper:       #f5f0e8;
  --paper-light: #faf7f2;
  --ink:         #2c2c2c;
  --ink-light:   #5a5a5a;
  --ink-faint:   #9a9590;
  --cinnabar:    #c0392b;
  --cinnabar-dark: #a5311f;
  --cinnabar-glow: rgba(192, 57, 43, 0.15);
  --seal-red:    #b8372b;
  --gold:        #b8860b;
  --huaixi:      #c0392b;
  --zhedong:     #2e6da4;
  --donggong:    #27874a;
  --zhuwang:     #7b4fa0;
  --jinchen:     #b8860b;
  --scroll-bg:   #ede8dd;
  --shadow:      rgba(44, 44, 44, 0.08);
  --transition:  0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  background-color: var(--paper);
  /* subtle rice-paper texture */
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(210,200,180,0.15) 0%, transparent 70%),
    radial-gradient(ellipse at 80% 20%, rgba(200,190,170,0.1) 0%, transparent 60%);
  color: var(--ink);
  line-height: 1.85;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

/* ========== LAYOUT ========== */
#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 20px 80px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  padding-bottom: max(80px, env(safe-area-inset-bottom));
  position: relative;
}

/* ========== HEADER ========== */
.header {
  text-align: center;
  padding: 40px 0 30px;
  position: relative;
}

.header-title {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--ink);
  margin-bottom: 4px;
}

.header-subtitle {
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--ink-faint);
  letter-spacing: 0.15em;
}

.header-line {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-faint), transparent);
  margin: 20px auto 0;
}

/* ========== PACING EFFECTS ========== */
.pacing-container {
  transition: all 0.6s ease;
  border-left: 3px solid transparent;
  padding-left: 0;
  border-radius: 0;
}

.pacing-紧迫 .pacing-container {
  border-left-color: var(--cinnabar);
  padding-left: 16px;
  animation: urgentPulse 2s ease-in-out infinite;
}

.pacing-缓冲 {
  background-color: #f0f5e8;
}
.pacing-缓冲 .pacing-container {
  padding: 8px 0;
}

.pacing-反转 {
  position: relative;
}
.pacing-反转::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--cinnabar), #e74c3c, var(--cinnabar));
  animation: reversalGlow 1.5s ease-in-out infinite;
}

.pacing-沉淀 {
  filter: saturate(0.6);
}

@keyframes urgentPulse {
  0%, 100% { border-left-color: var(--cinnabar); }
  50% { border-left-color: rgba(192, 57, 43, 0.3); }
}

@keyframes reversalGlow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ========== NARRATIVE AREA ========== */
.narrative-area {
  padding: 24px 0;
  min-height: 200px;
}

.narrative-text {
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 2;
  text-align: justify;
  color: var(--ink);
  opacity: 0;
  transform: translateY(12px);
  animation: fadeInUp 0.8s ease forwards;
}

.narrative-text p {
  margin-bottom: 1.2em;
  text-indent: 2em;
}

.narrative-text p:first-child {
  text-indent: 0;
}

.narrative-text .year-mark {
  display: block;
  text-align: center;
  font-size: 0.85rem;
  color: var(--ink-faint);
  letter-spacing: 0.2em;
  margin-bottom: 1.5em;
}

/* --- 驳回叙事（行动不可行） --- */
.narrative-text.rejected {
  position: relative;
  padding: 20px 20px 20px 24px;
  background: linear-gradient(135deg, rgba(192,57,43,0.04) 0%, rgba(192,57,43,0.02) 100%);
  border-left: 3px solid var(--cinnabar);
  border-radius: 4px;
  font-style: italic;
  color: var(--ink-light);
}

.narrative-text.rejected::before {
  content: '此路不通';
  display: block;
  font-style: normal;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.3em;
  color: var(--cinnabar);
  margin-bottom: 12px;
  text-indent: 0;
  opacity: 0.7;
}

.narrative-text.rejected p {
  text-indent: 2em;
  margin-bottom: 1em;
}

.narrative-text.rejected p:first-child {
  text-indent: 0;
}

/* 驳回回合的选项区域提示 */
.choices-area.rejected-hint::before {
  content: '请重新斟酌你的行动';
  display: block;
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-faint);
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  font-style: italic;
}

/* --- 流式输出区域 --- */
.stream-area {
  padding: 24px 0;
  min-height: 120px;
}

.stream-text {
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 2;
  text-align: justify;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
  opacity: 0;
  animation: fadeInUp 0.4s ease forwards;
}

.stream-text .stream-cursor {
  display: inline-block;
  width: 8px;
  height: 1.1em;
  background: var(--cinnabar);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.8s step-end infinite;
  border-radius: 1px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ========== INK DIVIDER ========== */
.ink-divider {
  width: 100%;
  height: 20px;
  margin: 8px 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ink-divider::before {
  content: '';
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--ink-faint) 15%,
    var(--ink-light) 50%,
    var(--ink-faint) 85%,
    transparent 100%
  );
  opacity: 0.5;
}

.ink-divider::after {
  content: '◆';
  position: absolute;
  font-size: 8px;
  color: var(--ink-faint);
  background: var(--paper);
  padding: 0 12px;
}

/* ========== CHOICES AREA ========== */
.choices-area {
  padding: 16px 0 24px;
}

.choice-btn {
  display: block;
  width: 100%;
  padding: 16px 24px;
  margin-bottom: 12px;
  background: var(--scroll-bg);
  border: 1px solid rgba(44, 44, 44, 0.12);
  border-radius: 4px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  position: relative;
  transition: all var(--transition);
  opacity: 0;
  transform: translateX(-10px);
  line-height: 1.6;
  /* bamboo scroll texture */
  background-image: linear-gradient(
    90deg,
    rgba(44,44,44,0.02) 0px,
    transparent 1px,
    transparent 14px,
    rgba(44,44,44,0.015) 15px
  );
  background-size: 15px 100%;
}

.choice-btn:nth-child(1) { animation: slideInChoice 0.5s 0.3s ease forwards; }
.choice-btn:nth-child(2) { animation: slideInChoice 0.5s 0.45s ease forwards; }
.choice-btn:nth-child(3) { animation: slideInChoice 0.5s 0.6s ease forwards; }
.choice-btn:nth-child(4) { animation: slideInChoice 0.5s 0.75s ease forwards; }

@keyframes slideInChoice {
  to { opacity: 1; transform: translateX(0); }
}

.choice-btn:hover {
  background-color: #e8e0d2;
  border-color: rgba(44, 44, 44, 0.25);
  transform: translateX(4px);
  box-shadow: -3px 0 0 var(--cinnabar);
}

.choice-btn:active {
  transform: translateX(2px);
  background-color: #ddd5c5;
}

.choice-btn .choice-index {
  display: inline-block;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: var(--ink);
  color: var(--paper);
  border-radius: 50%;
  font-size: 0.75rem;
  font-weight: 600;
  margin-right: 12px;
  flex-shrink: 0;
}

.choice-btn .choice-text {
  flex: 1;
}

.choice-btn.free-action {
  border-style: dashed;
  background: transparent;
  color: var(--ink-light);
  font-style: italic;
}

.choice-btn.free-action:hover {
  background: rgba(192, 57, 43, 0.04);
  border-color: var(--cinnabar);
  color: var(--cinnabar);
  box-shadow: -3px 0 0 var(--cinnabar);
}

/* ========== FREE ACTION INPUT ========== */
.free-action-input-area {
  display: none;
  margin-top: 8px;
  margin-bottom: 16px;
  animation: fadeInUp 0.3s ease forwards;
}

.free-action-input-area.active {
  display: flex;
  gap: 8px;
}

.free-action-input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid rgba(44, 44, 44, 0.2);
  border-radius: 4px;
  background: var(--paper-light);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem;
  color: var(--ink);
  outline: none;
  transition: border-color var(--transition);
}

.free-action-input:focus {
  border-color: var(--cinnabar);
  box-shadow: 0 0 0 2px var(--cinnabar-glow);
}

.free-action-input::placeholder {
  color: var(--ink-faint);
  font-style: italic;
}

.send-btn {
  padding: 12px 20px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 4px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.send-btn:hover {
  background: var(--cinnabar);
}

/* ========== STATUS PANEL ========== */
.status-panel {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 720px;
  z-index: 100;
  transition: all 0.4s ease;
}

.status-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: rgba(44, 44, 44, 0.92);
  backdrop-filter: blur(12px);
  color: var(--paper);
  font-size: 0.82rem;
  letter-spacing: 0.05em;
  cursor: pointer;
  user-select: none;
  transition: all var(--transition);
}

.status-summary:hover {
  background: rgba(44, 44, 44, 0.96);
}

.status-summary-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-pacing-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.1);
}

.status-toggle {
  font-size: 0.9rem;
  transition: transform 0.3s ease;
}

.status-panel.expanded .status-toggle {
  transform: rotate(180deg);
}

.status-detail {
  background: rgba(44, 44, 44, 0.95);
  backdrop-filter: blur(16px);
  padding: 0 20px;
  max-height: 0;
  overflow: hidden;
  transition: all 0.4s ease;
}

.status-panel.expanded .status-detail {
  max-height: 420px;
  padding: 16px 20px 20px;
  overflow-y: auto;
}

/* Status content */
.status-section {
  margin-bottom: 16px;
}

.status-section:last-child {
  margin-bottom: 0;
}

.status-section-title {
  font-size: 0.72rem;
  font-weight: 300;
  color: rgba(245, 240, 232, 0.5);
  letter-spacing: 0.2em;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.attr-row, .faction-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  font-size: 0.82rem;
  color: rgba(245, 240, 232, 0.85);
}

.attr-label, .faction-label {
  width: 48px;
  flex-shrink: 0;
  font-weight: 400;
}

.attr-bar-wrap, .faction-bar-wrap {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  margin: 0 10px;
  overflow: hidden;
  position: relative;
}

.attr-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.attr-bar.power   { background: linear-gradient(90deg, #e74c3c, #c0392b); }
.attr-bar.people  { background: linear-gradient(90deg, #f39c12, #e67e22); }
.attr-bar.wisdom  { background: linear-gradient(90deg, #3498db, #2980b9); }
.attr-bar.bond    { background: linear-gradient(90deg, #2ecc71, #27ae60); }
.attr-bar.fame    { background: linear-gradient(90deg, #9b59b6, #8e44ad); }

.attr-value {
  width: 28px;
  text-align: right;
  font-size: 0.78rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Faction bar - dual direction */
.faction-bar-container {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  margin: 0 10px;
  position: relative;
  overflow: visible;
}

.faction-bar-center {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(255,255,255,0.2);
  z-index: 1;
}

.faction-bar-fill {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 3px;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.faction-value {
  width: 32px;
  text-align: right;
  font-size: 0.78rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Emperor section */
.emperor-section {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  background: rgba(184, 134, 11, 0.08);
  border: 1px solid rgba(184, 134, 11, 0.15);
  border-radius: 6px;
}

.emperor-label {
  font-size: 0.85rem;
  color: var(--gold);
  margin-right: 12px;
  white-space: nowrap;
}

.emperor-bar-wrap {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  position: relative;
  overflow: visible;
}

.emperor-bar-center {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(255,255,255,0.2);
  z-index: 1;
}

.emperor-bar-fill {
  position: absolute;
  top: 0;
  height: 100%;
  background: linear-gradient(90deg, #b8860b, #daa520);
  border-radius: 4px;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.emperor-value {
  width: 36px;
  text-align: right;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

/* ========== FLOATING CHANGE NOTIFICATIONS ========== */
.floating-changes {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.float-notify {
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 0.82rem;
  font-weight: 500;
  font-family: 'Noto Serif SC', serif;
  background: rgba(44, 44, 44, 0.88);
  color: var(--paper);
  backdrop-filter: blur(8px);
  opacity: 0;
  transform: translateY(-10px) translateX(10px);
  animation: floatIn 0.4s ease forwards, floatOut 0.4s 2s ease forwards;
  white-space: nowrap;
}

.float-notify.positive { border-left: 3px solid #2ecc71; }
.float-notify.negative { border-left: 3px solid #e74c3c; }
.float-notify.neutral  { border-left: 3px solid var(--ink-faint); }

@keyframes floatIn {
  to { opacity: 1; transform: translateY(0) translateX(0); }
}

@keyframes floatOut {
  to { opacity: 0; transform: translateY(-20px) translateX(10px); }
}

/* ========== INPUT SCREENS ========== */
.input-screen {
  text-align: center;
  padding: 40px 0;
}

.input-screen h2 {
  font-size: 1.2rem;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--ink);
}

.input-screen .subtitle {
  font-size: 0.88rem;
  color: var(--ink-light);
  margin-bottom: 28px;
  font-weight: 300;
}

.name-input {
  display: block;
  width: 240px;
  margin: 0 auto 16px;
  padding: 12px 20px;
  border: none;
  border-bottom: 2px solid var(--ink);
  background: transparent;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.3rem;
  text-align: center;
  color: var(--ink);
  outline: none;
  transition: border-color var(--transition);
  letter-spacing: 0.1em;
}

.name-input:focus {
  border-bottom-color: var(--cinnabar);
}

.name-input::placeholder {
  color: var(--ink-faint);
  font-weight: 300;
  letter-spacing: 0.15em;
}

.confirm-btn {
  display: inline-block;
  margin-top: 8px;
  padding: 10px 36px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 3px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.1em;
}

.confirm-btn:hover {
  background: var(--cinnabar);
}

.random-btn {
  display: inline-block;
  margin-top: 8px;
  padding: 10px 28px;
  background: transparent;
  color: var(--ink-light);
  border: 1px solid var(--ink-faint);
  border-radius: 3px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.08em;
}

.random-btn:hover {
  border-color: var(--cinnabar);
  color: var(--cinnabar);
}

/* ========== LOADING DOTS ========== */
.loading-dots {
  display: inline-flex;
  gap: 4px;
  padding: 16px 0;
}

.loading-dots span {
  width: 6px;
  height: 6px;
  background: var(--ink-faint);
  border-radius: 50%;
  animation: dotPulse 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1.2); }
}

/* ========== MENU BUTTONS ========== */
.menu-btns {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 50;
}

.menu-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--ink-faint);
  background: rgba(245, 240, 232, 0.9);
  backdrop-filter: blur(4px);
  color: var(--ink-light);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  font-family: 'Noto Serif SC', serif;
}

.menu-btn:hover {
  border-color: var(--cinnabar);
  color: var(--cinnabar);
  background: rgba(245, 240, 232, 1);
}

/* ========== SAVE/LOAD MODAL ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44, 44, 44, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--paper-light);
  border: 1px solid var(--ink-faint);
  border-radius: 6px;
  width: 90%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px 24px;
  box-shadow: 0 12px 40px rgba(44,44,44,0.2);
  transform: translateY(20px);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-box {
  transform: translateY(0);
}

.modal-title {
  font-size: 1.2rem;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.2em;
  margin-bottom: 4px;
  color: var(--ink);
}

.modal-subtitle {
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-faint);
  margin-bottom: 24px;
  letter-spacing: 0.08em;
}

.save-slot {
  border: 1px solid #d8d2c8;
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 12px;
  background: var(--paper);
  transition: all var(--transition);
  cursor: pointer;
}

.save-slot:hover {
  border-color: var(--cinnabar);
  box-shadow: 0 2px 8px rgba(192,57,43,0.1);
}

.save-slot.empty {
  border-style: dashed;
  text-align: center;
  color: var(--ink-faint);
  font-size: 0.9rem;
  padding: 24px 16px;
}

.slot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.slot-num {
  font-weight: 600;
  font-size: 1rem;
  color: var(--cinnabar);
  letter-spacing: 0.1em;
}

.slot-time {
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.slot-info {
  font-size: 0.85rem;
  color: var(--ink-light);
  line-height: 1.7;
}

.slot-info span {
  margin-right: 12px;
}

.slot-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.slot-btn {
  padding: 5px 14px;
  border: 1px solid var(--ink-faint);
  background: transparent;
  color: var(--ink-light);
  border-radius: 3px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all var(--transition);
}

.slot-btn:hover {
  border-color: var(--cinnabar);
  color: var(--cinnabar);
}

.slot-btn.danger:hover {
  border-color: #c0392b;
  color: #c0392b;
}

.modal-close {
  display: block;
  margin: 16px auto 0;
  padding: 8px 28px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 3px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background var(--transition);
}

.modal-close:hover {
  background: var(--cinnabar);
}

/* ========== SEAL WATERMARK ========== */
.seal-watermark {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  opacity: 0.06;
  pointer-events: none;
  z-index: 1;
}

.seal-watermark svg {
  width: 100%;
  height: 100%;
}

/* ========== TURN INFO ========== */
.turn-info {
  text-align: center;
  font-size: 0.78rem;
  color: var(--ink-faint);
  letter-spacing: 0.15em;
  padding: 12px 0 4px;
  font-weight: 300;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 480px) {
  #app { padding: max(16px, env(safe-area-inset-top)) 14px max(80px, env(safe-area-inset-bottom)); }
  .header { padding: 24px 0 20px; }
  .header-title { font-size: 1.5rem; letter-spacing: 0.15em; }
  .header-subtitle { font-size: 0.75rem; }
  .narrative-text { font-size: 0.95rem; line-height: 1.85; }
  .choice-btn {
    padding: 14px 16px;
    font-size: 0.88rem;
    min-height: 48px;
  }
  .floating-changes { right: 8px; top: max(60px, env(safe-area-inset-top)); }
  .float-notify { font-size: 0.75rem; padding: 4px 8px; }
  .status-detail { padding-left: 10px; padding-right: 10px; }
  .status-panel.expanded .status-detail { max-height: 360px; }
  .menu-btn {
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
  }
  .menu-buttons {
    top: max(12px, env(safe-area-inset-top));
    right: 10px;
  }
  .modal-content { width: 92vw; max-height: 80vh; max-height: 80dvh; }
  .turn-info { font-size: 0.78rem; }
  .attr-bar { height: 8px; }
  .faction-bar { height: 6px; }
  .loading-text { font-size: 0.9rem; }
  .free-input { font-size: 0.9rem; padding: 12px; }
  .confirm-btn { min-height: 48px; font-size: 0.95rem; }
  .input-screen h2 { font-size: 1.4rem; }
  .input-screen .subtitle { font-size: 0.85rem; }
}

/* ========== HISTORY LOG ========== */
.history-entry {
  padding: 16px 0;
  border-bottom: 1px solid rgba(44,44,44,0.06);
  opacity: 0.55;
  transition: opacity var(--transition);
}

.history-entry:hover {
  opacity: 0.85;
}

.history-choice-made {
  font-size: 0.8rem;
  color: var(--cinnabar);
  margin-top: 8px;
  padding-left: 1em;
  border-left: 2px solid var(--cinnabar-glow);
}

/* ========== TYPING EFFECT ========== */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--ink);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.8s step-end infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>

  <button class="menu-btn" onclick="openSaveModal()" title="存档">💾</button>

        </div>
        <span class="emperor-value" id="emperorValue">0</span>
      </div>

<script>
// ========== API CONFIG ==========
// 生产环境：通过后端代理 /api/chat 直连大模型 API，Key 存储在服务端环境变量中
const BOT_CONFIG = {
  // 代理端点（Vercel Serverless Function）
  proxyUrl: '/api/chat',
  // 模式：'demo' 使用本地模拟数据，'live' 调用真实大模型 API
  mode: 'live'
};

// 对话历史（前端维护，每次请求发送给后端）
let chatHistory = [];

function toggleMode() {
  if (BOT_CONFIG.mode === 'demo') {
    BOT_CONFIG.mode = 'live';
    document.getElementById('modeBtn').textContent = '🔥';
    document.getElementById('modeBtn').title = '实时模式（点击切回演示）';
  } else {
    BOT_CONFIG.mode = 'demo';
    document.getElementById('modeBtn').textContent = '📝';
    document.getElementById('modeBtn').title = '演示模式（点击切换实时）';
  }
  location.reload();
}

// ========== GAME STATE ==========
const GameState = {
  turn: 1,
  year: 1375,
  month: 1,
  pacing: '日常',
  character: {
    name: '',
    age: 22,
    baseAge: 22,   // 开局（1375年）年龄，年龄由前端按年份差硬算，不采信AI
    background: '',
    position: '未入流',
    rank: 0
  },
  attributes: { power: 20, people: 30, wisdom: 40, bond: 50, fame: 10 },
  factions: { huaixi: 0, zhedong: 0, donggong: 0, zhuwang: 0, jinchen: 0 },
  emperor_feeling: 0,
  seeds: [],
  seeds_triggered: []
};

// ========== LABELS ==========
const ATTR_LABELS = {
  power:  '权势', people: '民心', wisdom: '智谋', bond: '情义', fame: '声望'
};

const FACTION_LABELS = {
  huaixi:  '淮西', zhedong: '浙东', donggong: '东宫', zhuwang: '诸王', jinchen: '近臣'
};

const FACTION_COLORS = {
  huaixi: 'var(--huaixi)', zhedong: 'var(--zhedong)',
  donggong: 'var(--donggong)', zhuwang: 'var(--zhuwang)', jinchen: 'var(--jinchen)'
};

const PACING_ICONS = {
  '紧迫': '🔥', '缓冲': '🍃', '反转': '⚡', '沉淀': '🌊', '日常': '📜'
};

const YEAR_MAP = {
  1368: '洪武元年', 1369: '洪武二年', 1370: '洪武三年',
  1371: '洪武四年', 1372: '洪武五年', 1373: '洪武六年',
  1374: '洪武七年', 1375: '洪武八年', 1376: '洪武九年',
  1377: '洪武十年', 1378: '洪武十一年', 1379: '洪武十二年',
  1380: '洪武十三年', 1381: '洪武十四年', 1382: '洪武十五年',
  1383: '洪武十六年', 1384: '洪武十七年', 1385: '洪武十八年',
  1386: '洪武十九年', 1387: '洪武二十年', 1388: '洪武二十一年',
  1389: '洪武二十二年', 1390: '洪武二十三年', 1391: '洪武二十四年',
  1392: '洪武二十五年', 1393: '洪武二十六年'
};

function getYearName(y) {
  return YEAR_MAP[y] || `洪武${y - 1367}年`;
}

// ========== DOM REFS ==========
const gameContainer = document.getElementById('gameContainer');
const statusPanel   = document.getElementById('statusPanel');
const floatingChanges = document.getElementById('floatingChanges');

// ========== STATUS PANEL ==========
let panelExpanded = false;

function toggleStatusPanel() {
  panelExpanded = !panelExpanded;
  statusPanel.classList.toggle('expanded', panelExpanded);
}

function updateStatusPanel() {
  const yearStr = getYearName(GameState.year);
  const pacingIcon = PACING_ICONS[GameState.pacing] || '📜';
  document.getElementById('statusYear').textContent = yearStr;
  document.getElementById('statusPacing').textContent = `${pacingIcon} ${GameState.pacing}`;
  document.getElementById('statusPosition').textContent = GameState.character.position;

  // Attributes
  const attrContainer = document.getElementById('attrRows');
  attrContainer.innerHTML = '';
  for (const [key, label] of Object.entries(ATTR_LABELS)) {
    const val = Math.max(0, Math.min(100, GameState.attributes[key]));
    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `
      <span class="attr-label">${label}</span>
      <div class="attr-bar-wrap">
        <div class="attr-bar ${key}" style="width:${val}%"></div>
      </div>
      <span class="attr-value">${val}</span>
    `;
    attrContainer.appendChild(row);
  }

  // Factions
  const factionContainer = document.getElementById('factionRows');
  factionContainer.innerHTML = '';
  for (const [key, label] of Object.entries(FACTION_LABELS)) {
    const val = Math.max(-100, Math.min(100, GameState.factions[key]));
    const pct = (val + 100) / 2; // map -100~100 to 0~100
    const color = FACTION_COLORS[key];
    const isPositive = val >= 0;
    const barLeft = isPositive ? '50%' : `${pct}%`;
    const barWidth = `${Math.abs(val) / 2}%`;
    const row = document.createElement('div');
    row.className = 'faction-row';
    row.innerHTML = `
      <span class="faction-label">${label}</span>
      <div class="faction-bar-container">
        <div class="faction-bar-center"></div>
        <div class="faction-bar-fill" style="left:${barLeft};width:${barWidth};background:${color}"></div>
      </div>
      <span class="faction-value" style="color:${color}">${val > 0 ? '+' : ''}${val}</span>
    `;
    factionContainer.appendChild(row);
  }

  // Emperor
  const empVal = Math.max(-100, Math.min(100, GameState.emperor_feeling));
  const empPct = (empVal + 100) / 2;
  const empPositive = empVal >= 0;
  const empBar = document.getElementById('emperorBar');
  empBar.style.left = empPositive ? '50%' : `${empPct}%`;
  empBar.style.width = `${Math.abs(empVal) / 2}%`;
  document.getElementById('emperorValue').textContent = `${empVal > 0 ? '+' : ''}${empVal}`;
}

// ========== PACING VISUAL ==========
function applyPacing(pacing) {
  const app = document.getElementById('app');
  // Remove old pacing classes
  app.className = '';
  if (pacing && pacing !== '日常') {
    app.classList.add(`pacing-${pacing}`);
  }
  GameState.pacing = pacing || '日常';
  updateStatusPanel();
}

// ========== FLOATING NOTIFICATIONS ==========
function showFloatingChanges(changes) {
  const container = floatingChanges;
  container.innerHTML = '';

  const items = [];

  // Attribute changes
  if (changes.attributes) {
    for (const [key, delta] of Object.entries(changes.attributes)) {
      if (delta !== 0) {
        items.push({
          text: `${delta > 0 ? '+' : ''}${delta} ${ATTR_LABELS[key] || key}`,
          type: delta > 0 ? 'positive' : 'negative'
        });
      }
    }
  }

  // Faction changes
  if (changes.factions) {
    for (const [key, delta] of Object.entries(changes.factions)) {
      if (delta !== 0) {
        items.push({
          text: `${delta > 0 ? '+' : ''}${delta} ${FACTION_LABELS[key] || key}`,
          type: delta > 0 ? 'positive' : 'negative'
        });
      }
    }
  }

  // Emperor change
  if (changes.emperor_feeling && changes.emperor_feeling !== 0) {
    items.push({
      text: `${changes.emperor_feeling > 0 ? '+' : ''}${changes.emperor_feeling} 天子圣眷`,
      type: changes.emperor_feeling > 0 ? 'positive' : 'negative'
    });
  }

  items.forEach((item, i) => {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = `float-notify ${item.type}`;
      el.textContent = item.text;
      container.appendChild(el);
      // Remove after animation
      setTimeout(() => el.remove(), 2800);
    }, i * 150);
  });
}

// ========== APPLY STATE CHANGES ==========
function applyChanges(changes) {
  if (changes.attributes) {
    for (const [key, delta] of Object.entries(changes.attributes)) {
      if (GameState.attributes[key] !== undefined) {
        GameState.attributes[key] = Math.max(0, Math.min(100, GameState.attributes[key] + delta));
      }
    }
  }
  if (changes.factions) {
    for (const [key, delta] of Object.entries(changes.factions)) {
      if (GameState.factions[key] !== undefined) {
        GameState.factions[key] = Math.max(-100, Math.min(100, GameState.factions[key] + delta));
      }
    }
  }
  if (changes.emperor_feeling !== undefined) {
    GameState.emperor_feeling = Math.max(-100, Math.min(100, GameState.emperor_feeling + changes.emperor_feeling));
  }
  if (changes.seeds) {
    GameState.seeds.push(...changes.seeds);
  }

  updateStatusPanel();
  showFloatingChanges(changes);
}

// ========== JSON 鲁棒解析器 ==========
// 从任意文本中尝试提取并解析最外层的 JSON 对象，兼容多种 AI 输出风格：
// ① ```json ... ``` 代码块（含/不含 json 标签、含/不含多余反引号）
// ② 直接以 { 开头的纯 JSON
// ③ JSON 前后/中间混了文字、中文标点、空行等噪声
// ④ 多层嵌套、跨多行、缩进不一
function tryParseJSON(raw) {
  if (!raw) return null;
  const s = typeof raw === 'string' ? raw : String(raw);

  // 策略1：找最外层 {} 块（从首个 { 到对应的 }）
  const start = s.indexOf('{');
  if (start >= 0) {
    // 从 start 开始找匹配的 }，处理嵌套
    let depth = 0, end = -1;
    let inStr = false, esc = false;
    for (let i = start; i < s.length; i++) {
      const ch = s[i];
      if (esc) { esc = false; continue; }
      if (ch === '\\') { esc = true; continue; }
      if (ch === '"' || ch === "'") { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{') depth++;
      else if (ch === '}') { depth--; if (depth === 0) { end = i; break; } }
    }
    if (end > start) {
      let candidate = s.slice(start, end + 1);
      // 清理常见 AI 噪声：中文引号→英文引号、全角冒号/逗号→半角、多余空白
      candidate = candidate
        .replace(/\u201c/g, '"').replace(/\u201d/g, '"')  // 中文双引号
        .replace(/\u2018/g, "'").replace(/\u2019/g, "'")  // 中文单引号
        .replace(/\uff1a/g, ':')    // 全角冒号
        .replace(/\uff0c/g, ',')    // 全角逗号
        .replace(/\u3002/g, '.')    // 中文句号（字符串外不处理，但整体替换一般无害）
        .replace(/\s+/g, ' ')       // 合并空白
        .trim();
      try {
        const obj = JSON.parse(candidate);
        // 基本校验：必须包含 turn 或 pacing 等状态字段之一，否则可能是别的 JSON
        if (obj && typeof obj === 'object' &&
            ('turn' in obj || 'pacing' in obj || 'year' in obj || 'changes' in obj)) {
          return obj;
        }
      } catch (_) { /* 继续尝试其他策略 */ }
    }
  }

  // 策略2：找 ``` 或 ```` 代码块，再从中提取 JSON
  const codeRe = /`{3,4}\s*(?:json)?\s*([\s\S]*?)`{3,4}/i;
  const m = s.match(codeRe);
  if (m) {
    try {
      const obj = JSON.parse(m[1].trim());
      if (obj && typeof obj === 'object' &&
          ('turn' in obj || 'pacing' in obj || 'year' in obj || 'changes' in obj)) {
        return obj;
      }
    } catch (_) {}
  }

  return null;
}

// ========== 叙事文本净化 ==========
// AI 返回整段 text 中可能混入未解析的 JSON 块/代码块，从显示中剔除
function sanitizeNarrative(raw) {
  if (!raw) return raw;
  let t = raw;
  // 去掉 ```json ... ``` 代码块
  t = t.replace(/`{3,4}\s*(?:json)?\s*[\s\S]*?`{3,4}/gi, '');
  // 去掉残留的 markdown 标记：```、`、```
  t = t.replace(/`{3,4}\s*/g, '').replace(/`{1,2}/g, '');
  // 去掉孤立的 { ... } 块（未被解析器捕获的）
  t = t.replace(/\{[\s\S]*?\}\s*$/gm, '');
  // 清理首尾空白与连续空行
  t = t.replace(/\n{3,}/g, '\n\n').trim();
  return t;
}

// ========== PARSE AI OUTPUT ==========
function parseAIOutput(text) {
  // Split by --- dividers
  const sections = text.split(/\n---\n/);

  let narrative = '';
  let choices = [];
  let stateBlock = null;

  if (sections.length >= 3) {
    narrative = sanitizeNarrative(sections[0].trim());
    const choicesText = sections[1].trim();
    const stateText = sections[2].trim();

    // Parse choices
    const choiceLines = choicesText.split('\n').filter(l => l.trim());
    choiceLines.forEach(line => {
      const match = line.match(/^\d+\.\s*[「『]?(.+?)[」』]?\s*$/) ||
                    line.match(/^\d+\.\s*(.+)$/);
      if (match) {
        let text = match[1].trim();
        // Remove brackets if present
        text = text.replace(/^[「『]/, '').replace(/[」』]$/, '');
        choices.push(text);
      }
    });

    // Parse JSON state block：兼容多种代码块写法（```json、```、````、无代码块直接大括号开头）
    stateBlock = tryParseJSON(stateText);
  } else {
    // Fallback: 没有正确分隔，尝试从全文（含JSON散落）中提取选项+状态
    // 先尝试从整段 text 中提取 JSON（有些 AI 把 JSON 放在末尾不分割）
    stateBlock = tryParseJSON(text);
    narrative = sanitizeNarrative(text.trim());
    
    // 尝试从叙事文本中提取选项（匹配 1. xxx 格式）
    const lines = narrative.split('\n');
    const narrativeLines = [];
    const choiceLines = [];
    let inChoices = false;
    
    for (let i = lines.length - 1; i >= 0; i--) {
      const line = lines[i].trim();
      if (!line) continue;
      
      // 检测是否是选项格式（1. xxx, 2. xxx 等）
      const isChoice = /^\d+\.\s*[「『]?(.+?)[」』]?\s*$/.test(line) ||
                      /^\d+\.\s*(.+)$/.test(line);
      
      if (isChoice && !inChoices) {
        inChoices = true;
      }
      
      if (inChoices && isChoice) {
        choiceLines.unshift(line);
      } else if (inChoices) {
        // 遇到非选项行，停止提取
        break;
      }
    }
    
    // 如果提取到选项，从叙事中移除（即使只有 1-2 个也保留，不强制要求 3 个）
    if (choiceLines.length >= 1) {
      choiceLines.forEach(line => {
        const match = line.match(/^\d+\.\s*[「『]?(.+?)[」』]?\s*$/) ||
                      line.match(/^\d+\.\s*(.+)$/);
        if (match) {
          let choiceText = match[1].trim();
          choiceText = choiceText.replace(/^[「『]/, '').replace(/[」』]$/, '');
          choices.push(choiceText);
        }
        // 从叙事中移除这一行
        narrative = narrative.replace(line, '');
      });
      narrative = narrative.trim();
    }
  }

  return { narrative, choices, stateBlock };
}

// ========== RENDER NARRATIVE ==========
function renderNarrative(html, animate = true) {
  const div = document.createElement('div');
  div.className = 'narrative-area';

  const textDiv = document.createElement('div');
  textDiv.className = 'narrative-text';
  if (!animate) {
    textDiv.style.opacity = '1';
    textDiv.style.transform = 'none';
    textDiv.style.animation = 'none';
  }
  textDiv.innerHTML = html;

  div.appendChild(textDiv);
  
  // 兜底：强制触发重排并确保可见性（修复移动端动画偶尔不生效的问题）
  setTimeout(() => {
    if (window.getComputedStyle(textDiv).opacity === '0') {
      textDiv.style.opacity = '1';
      textDiv.style.transform = 'translateY(0)';
    }
  }, 100);
  
  return div;
}

function narrativeToHTML(text) {
  const paragraphs = text.split('\n').filter(l => l.trim());
  return paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
}

// ========== RENDER CHOICES ==========
function renderChoices(choices, callback) {
  const area = document.createElement('div');
  area.className = 'choices-area';

  const labels = ['甲', '乙', '丙', '丁'];

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    const isFree = choice.includes('自由行动') || choice.includes('自由');

    if (isFree) {
      btn.className = 'choice-btn free-action';
      btn.innerHTML = `<span class="choice-index">${labels[i] || i+1}</span><span class="choice-text">${choice}</span>`;
    } else {
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-index">${labels[i] || i+1}</span><span class="choice-text">${choice}</span>`;
    }

    btn.addEventListener('click', () => {
      if (isFree) {
        // Show free action input
        showFreeActionInput(area, callback, choice);
      } else {
        // Disable all buttons
        area.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          b.style.opacity = '0.4';
          b.style.pointerEvents = 'none';
        });
        btn.style.opacity = '1';
        btn.style.boxShadow = '-3px 0 0 var(--cinnabar)';
        // Show "chosen" note
        const note = document.createElement('div');
        note.className = 'history-choice-made';
        note.textContent = `▸ ${choice}`;
        area.appendChild(note);
        callback(choice);
      }
    });

    area.appendChild(btn);
  });

  return area;
}

function showFreeActionInput(area, callback, placeholder) {
  let inputArea = area.querySelector('.free-action-input-area');
  if (inputArea) {
    inputArea.classList.add('active');
    inputArea.querySelector('input').focus();
    return;
  }

  inputArea = document.createElement('div');
  inputArea.className = 'free-action-input-area active';
  inputArea.innerHTML = `
    <input type="text" class="free-action-input" placeholder="输入你想做的任何事…" />
    <button class="send-btn">发送</button>
  `;

  area.appendChild(inputArea);
  const input = inputArea.querySelector('input');
  const sendBtn = inputArea.querySelector('.send-btn');
  input.focus();

  const submit = () => {
    const val = input.value.trim();
    if (!val) return;
    inputArea.classList.remove('active');
    // Disable all
    area.querySelectorAll('.choice-btn').forEach(b => {
      b.disabled = true;
      b.style.opacity = '0.4';
      b.style.pointerEvents = 'none';
    });
    const note = document.createElement('div');
    note.className = 'history-choice-made';
    note.textContent = `▸ 自由行动：${val}`;
    area.appendChild(note);
    callback(val);
  };

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
  });
}

];

function randomSurname() {
  return SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
}

function generateGivenName(backgroundKey) {
  const namesByBg = {
    huaixi: ['承烈','定远','崇武','振威','铁山','世勋','仲戈','毅夫','伯韬','克戎'],
    zhedong: ['景濂','伯温','允修','叔明','彦和','敬之','希孟','道传','子静','正叔'],
    shanggu: ['万贯','宝臣','通海','聚丰','世昌','德裕','金生','利源','润之','丰盈'],
    qianyuan: ['守拙','怀远','复初','遗安','慕陶','伯夷','叔齐','幼安','子隐','思齐']
  };
  const pool = namesByBg[backgroundKey] || namesByBg.huaixi;
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateCharIntro(surname, givenName, bgKey) {
  const fullName = surname + givenName;
  const intros = {
    huaixi: `${fullName}，凤阳府定远县人氏。父亲早年随太祖起兵，南征北战，积功至千户，后在鄱阳湖一战中身负重伤，归乡不久便病故了。母亲蓝氏含辛茹苦将你拉扯大，她的幼弟蓝玉——你的嫡亲舅舅——如今在大都督府当差，随军北征西讨，正是当红的时候，逢年过节总不忘捎东西来看望你们母子。母亲临终前只留下一句话：「你爹是替大明死的，你莫要辱没了他。」\n\n你自幼在军营中摸爬滚打，弓马娴熟，也认得几个字。洪武三年，朝廷追录阵亡将士之后，你蒙荫补为殿前校尉，入京当差。如今你二十五岁，在应天府当了五年差，虽只是个七品武官，却也见过些世面——淮西老将们念着你父亲的旧情，舅舅蓝玉在军中又多有照拂；但朝中风向日变，这层关系究竟是福是祸，你也说不准。`,

    zhedong: `${fullName}，处州府青田县人氏。父亲是个落第秀才，一生未曾中举，只得在乡中开馆授徒，勉强糊口。他年轻时曾游学金华，与宁海方孝孺同在宋濂先生门下问学，虽日后境遇天差地别，书信往来却未曾断过。他对你管教极严，三岁识字，五岁背诗，八岁便开始读《春秋》。你倒也争气，十七岁中秀才，二十岁中举人——只可惜去年春闱名落孙山，铩羽而归。\n\n今年开春，父亲变卖了家中仅有的几亩薄田，凑了盘缠让你入京谋个出路。他说：「为父这辈子困在青田，你不能再困在这里。刘基先生也是青田人，他能做到的，你未必不能。」你背着书箱踏入应天门时，春雨正绵密。你听闻，刘基先生去年便已致仕归乡，如今缠绵病榻，据说胡丞相曾遣太医登门送药，个中蹊跷无人敢议——浙东文官集团失了擎天之柱，风雨欲来。但这也许正是你的机会。`,

    shanggu: `${fullName}，应天府江宁县人氏。沈家是应天府数得上的富户，经营绸缎、茶叶和盐引，在秦淮河畔有三间铺子，在苏州、扬州也有分号。你自小锦衣玉食，五岁开蒙，请的是致仕的老儒；十二岁便跟着父亲学算盘、看账本、辨绸缎成色。\n\n然而你心里清楚，在这大明天下，商人再有钱也不过是砧板上的肉。沈万三的前车之鉴犹在眼前——富可敌国又如何？一纸诏令，抄家流徙。父亲花了大笔银子替你捐了个监生，又托人在通政司谋了个知印的差事，从九品，不入流。你今年二十三岁，穿着皂色官服站在衙门里时，常觉得自己像个穿着戏服的伶人。但你知道，这是沈家从商入仕的唯一一步棋——走好了，沈家便能改换门庭；走砸了，万劫不复。`,

    qianyuan: `${fullName}，大都人氏——不对，如今该叫北平了。你祖上在前元做过翰林待制，虽不是什么大官，却也算得上诗礼传家。洪武元年徐达北伐，元顺帝仓皇北逃，你父亲带着家小滞留大都，没有跟王师走，也没有殉国——他选择了归顺。\n\n降臣之后，这四个字像烙印一样跟了你二十二年。你随父迁入应天府后，邻里侧目，同年避席。父亲被安置在翰林院做个待诏，从九品，俸禄微薄，却整日小心翼翼，连说话都要先看窗外有没有人。去年冬天他染了风寒，拖到开春便去了，临终前抓着你的手说：「为父这辈子，最错的就是没跟着圣上走。你……你莫要再走为父的老路。」你如今在翰林院做个抄誊的小吏，无品无级。你读了一肚子诗书，却连抬头走路都不敢——因为你知道，这世上最不缺的，就是揪着你出身做文章的人。`
  };
  return intros[bgKey] || intros.huaixi;
}

// 收集最近 n 段叙事的纯文本，作为"前情提要"随每回合下发
// 作用：①读档后 chatHistory 清空，AI 靠这个衔接剧情 ②长局历史被裁剪后也不会忘身世
function collectRecentPlot(n) {
  const texts = [];
  const areas = gameContainer.querySelectorAll('.narrative-area .narrative-text');
  for (let i = areas.length - 1; i >= 0 && texts.length < n; i--) {
    const t = areas[i].textContent.trim();
    if (t) texts.unshift(t);
  }
  if (!texts.length) return undefined;
  return '【前情提要】以下是玩家屏幕上已发生的最近剧情，必须无缝衔接、保持连贯，但严禁重复其中已写过的场景、事件、措辞与桥段（不得把同一件事再写一遍、不得让玩家原地经历相似情节）：\n' + texts.join('\n');
}

// 收集最近已出现/已选择的选项，防止 AI 反复给同样的选项
function collectRecentChoices() {
  const texts = [];
  const areas = gameContainer.querySelectorAll('.choices-area');
  for (let i = Math.max(0, areas.length - 3); i < areas.length; i++) {
    areas[i].querySelectorAll('.choice-text').forEach(el => {
      const t = (el.textContent || '').trim();
      if (t && !t.includes('自由行动') && !t.includes('自由')) texts.push(t);
    });
  }
  gameContainer.querySelectorAll('.history-choice-made').forEach(el => {
    const t = (el.textContent || '').replace(/^▸\s*/, '').trim();
    if (t) texts.push('（玩家已选过）' + t);
  });
  if (!texts.length) return undefined;
  return '【近期选项·严禁重复】以下选项最近已经给过或玩家已经选过，本回合3个固定选项必须是全新的行动方向，严禁原样重复或近义改写（如换个同义词再说一遍）；每个选项必须推动局面发生实质变化，严禁"静观其变/继续前行"这类选了毫无进展的凑数选项：\n' + texts.slice(-12).join('\n');
}

// 1. 获取当前在世NPC列表（代码硬控，杜绝死人复活）
function getAliveNPCs(year) {
  const alive = [];
  for (const [name, info] of Object.entries(NPC_BIRTH_DEATH)) {
    if (year < info.death) {
      const age = info.birth ? year - info.birth : null;
      const ageStr = age ? `${age}岁` : '年龄不详';
      alive.push(`${name}(${ageStr}，${info.personality})`);
    }
  }
  return alive.length ? `【当前在世重要人物】${alive.join('；')}。已故之人严禁以活人身份出场。` : '';
}

// 2. 获取当前可用机构名称（制度时间窗硬控，杜绝穿帮）
function getAllowedInstitutions(year) {
  const allowed = ['官差', '衙役'];
  if (year >= 1382) allowed.push('巡卒', '缇骑', '锦衣卫');
  if (year >= 1420) allowed.push('东厂');
  if (year >= 1477) allowed.push('西厂');
  
  const forbidden = [];
  if (year < 1382) forbidden.push('锦衣卫', '缇骑', '巡卒');
  if (year < 1420) forbidden.push('东厂');
  if (year < 1477) forbidden.push('西厂');
  
  let hint = `【当前时期(${year}年)可用称谓】${allowed.join('、')}`;
  if (forbidden.length) {
    hint += `；【严禁使用】${forbidden.join('、')}（尚未设立）`;
  }
  return hint;
}

// 3. 获取锚点铺垫方向（只给方向不给名称，防止剧透）
function getAnchorDirection(anchorId) {
  const directions = {
    1: "浙东文臣的命运正在被审视",
    2: "丞相府风声渐紧，中书省权力引发猜忌",
    3: "户部账目异常、地方财政频出问题",
    4: "前朝旧臣的牵连开始浮现",
    5: "淮西勋贵骄横跋扈、屡生事端",
    6: "太祖龙体抱恙、朝局暗流涌动"
  };
  return directions[anchorId] || "";
}

// 4. 获取锚点信息（分层：当前锚点完整信息、下一个锚点只给方向、更远锚点禁止提及）
function getAnchorHints(currentTurn) {
  let currentAnchor = null;
  let nextAnchorHint = null;
  const forbiddenEvents = [];
  
  for (const anchor of HISTORY_ANCHORS) {
    // 当前锚点：在窗口内或刚结束（余波期2回合）
    if (currentTurn >= anchor.start && currentTurn <= anchor.end + 2) {
      currentAnchor = anchor;
    }
    // 下一个锚点：即将发生（距离≤5回合）→ 只给铺垫方向
    else if (currentTurn < anchor.start && currentTurn >= anchor.start - 5) {
      nextAnchorHint = getAnchorDirection(anchor.id);
    }
    // 更远的锚点：禁止提及
    else if (currentTurn < anchor.start - 5) {
      forbiddenEvents.push(anchor.name);
    }
  }
  
  const hints = {};
  if (currentAnchor) {
    hints.current = `【当前锚点】${currentAnchor.name}（${currentAnchor.time}）：${currentAnchor.desc}`;
  }
  if (nextAnchorHint) {
    hints.next_hint = `【可铺垫方向】${nextAnchorHint}（可写模糊的坊间传闻、制度异常、人物处境，但严禁点名事件名称或预言结局）`;
  }
  if (forbiddenEvents.length) {
    hints.forbidden = `【严禁提及】${forbiddenEvents.join('、')}（尚未发生，不得作为已发生事件描写）`;
  }
  return hints;
}

  };

// 按回合号硬判节奏，返回 { pacing, directive }；规则与 SP 第12.2节一致
function getRhythmDirective(turn, background) {
  const t = turn;
  let r = null;

  // 优先级1：锚点事件窗口内 → ⚡反转
  for (const a of HISTORY_ANCHORS) {
    if (t >= a.start && t <= a.end) {
      const finaleExtra = a.id === 6 ? `
【终局强制·最高优先级】本锚点是游戏终点。朱元璋必须在本窗口（第${a.start}-${a.end}回，${a.time}）内驾崩；驾崩发生当回合的 JSON 状态块**必须包含 ending 结局字段**（含 title 与 description，按第11章结局规则根据玩家五项数值/阵营/好感结算结局，叙事不少于500字）。铁律：①驾崩只允许发生一次，本窗口之后朱元璋不得再出现、不得再次驾崩；②时间不得越过1398年，严禁书写建文、永乐年间任何剧情；③玩家若亲近燕王，最多在结局余韵中以一句"燕王就藩北平，北地风云暗涌"收束，严禁展开靖难；④输出 ending 后不得再给选项。` : '';
      r = { pacing: '反转', directive:
`【节奏指令·硬控】本回合处于历史锚点「${a.name}」事件窗口（第${a.start}-${a.end}回，历史时间：${a.time}）——${a.desc}。
本回合节奏必须为⚡反转：叙事800-1200字，长短句交替、以有冲击力的场面开头，写出格局骤变；给3个选项，其中必须有1个让玩家直接面对该事件；事件须在窗口内迎来高潮，不得拖延到窗口之外。${finaleExtra}` };
      break;
    }
  }
  // 优先级2：锚点前1-3回合 → 🔥紧迫
  if (!r) {
    for (const a of HISTORY_ANCHORS) {
      const dist = a.start - t;
      if (dist >= 1 && dist <= 3) {
        r = { pacing: '紧迫', directive:
`【节奏指令·硬控】距离历史锚点「${a.name}」还有${dist}回（预计第${a.start}回爆发，历史时间：${a.time}）——${a.desc}。
本回合节奏必须为🔥紧迫：叙事800-1200字，短句为主（单句不超过20字），急促紧张、命悬一线；给3个选项，至少1个涉及该锚点相关人物或当前时局（布局、打探、伏笔均可）。**严禁直接点名该事件名称或暗示其结果**（例如：对「胡惟庸案」只能写"丞相府近日风声紧""中书省公文堆积异常""故旧密访频繁"，不能说"胡惟庸将被诛""谋反案发"等）。允许以当事人"当前在世的活跃状态"登场作伏笔（如胡惟庸仍在居中用权、郭桓仍在户部理事），但不得预言其结局。**严禁提前触发后续锚点事件**：当前尚未发生的锚点事件既不可描写为"案发"、也不可作为"被调查/被牵连"的对象（例如第 19 回合：胡惟庸案尚在酝酿→可以写"中书省风声紧"；但郭桓案是更远的未来锚点→严禁写"锦衣卫查郭桓"或"户部账目被翻查"等指向郭桓案的具体情节）。⏰本回合时间推进**1-2个月**（紧迫节奏也要推进时间，禁止原地踏步），year/month 须相应后移。` };
        break;
      }
    }
  }
  // 优先级3：锚点后1-2回合 → 🌊沉淀
  if (!r) {
    for (const a of HISTORY_ANCHORS) {
      const after = t - a.end;
      if (after >= 1 && after <= 2) {
        r = { pacing: '沉淀', directive:
`【节奏指令·硬控】历史锚点「${a.name}」刚落幕${after}回，本回合节奏必须为🌊沉淀：叙事300-500字，长句、深沉内敛，写事件余波与劫后余生；给3个选项，以善后、清算、自保、反思为主；时间**必须跳跃12-24个月**（"半年后/一年后/两年后"），事件余波快速翻篇，不可在同一事件内纠缠。` };
        break;
      }
    }
  }
  // 优先级4：无事件回合 → 📜日常（统一节奏，承担主要时间推进任务）
  if (!r) {
    r = { pacing: '日常', directive:
`【节奏指令·硬控】本回合无历史锚点临近，节奏为📜日常（常规政务 + 时间快进）：叙事400-700字，平稳扎实、生活化细节，岁月流转；给4个经营型选项（探索/社交/官场/经营均可）；⏰时间**必须推进6-12个月**，允许蒙太奇式快进（"半年过去""年关将至""次年春""转眼间已是洪武X年"），本回合的核心任务是推进年份向下一个历史锚点靠拢。所有出场人物、机构、制度必须符合当前年份的真实历史（例如：1382年前不可出现"锦衣卫"字样，只能称"缇骑""巡卒""官差"；已死之人不得复活；未发生的案件不可作为已发生事件提及，但可作为模糊的坊间风声伏笔）。` };
    // v3.6: warrior acceleration
    if (background === '淮西武将之后') {
      var inA = HISTORY_ANCHORS.some(function(a){return turn>=a.start && turn<=a.end+2;});
      if (!inA && turn > 5) {
        r.directive += '\n\n\u3010\u23e9\u6b66\u5c06\u52a0\u901f\u3011\u5f53\u524d\u65e0\u76f4\u63a5\u5173\u8054\u6b66\u5c06\u7684\u6838\u5fc3\u951a\u70b9\uff0c\u65f6\u95f4\u63a8\u8fdb\u5e45\u5ea6\u7ffb\u500d\u81f312-24\u4e2a\u6708\uff0c\u5feb\u901f\u63a8\u8fdb\u5230\u84dd\u7389\u6848\u7b49\u6b66\u5c06\u5207\u8eab\u951a\u70b9\u3002';
      }
    }
  }

  // 种子引爆例外 + 强制对齐 JSON
  r.directive += `\n\n【️强制·种子例外与JSON】若本回合你判断 current_state.seeds 中某颗种子达到引爆时机，可将节奏升级为反转并写出引爆后果，种子引爆优先于上述历史节奏；②除此之外**必须严格按上述节奏执行，JSON 状态块中的 pacing 字段必须填写「${r.pacing}」，不可填写其他值**（前端会校验，填错则整个状态块被丢弃、数值回合全不推进）；③year/month 须与当前历史年份的推进逻辑一致（反转/紧迫回合参照正在发生或即将爆发的历史事件时间点；日常/沉淀回合只需保证年份单调递增，不得倒退）；④JSON 必须放在 \`{ ... }\` 代码块内，且紧跟在三个选项之后，用 \`---\` 分隔。`;
  return r;
}

// ========== STREAMING API CALL ==========
// 调用后端代理，流式接收 AI 回复，逐字显示在 streamTarget 元素中
async function streamBotAPI(userMessage, streamTarget) {
  // 前端节奏引擎：按即将生成的回合号硬判节奏（历史锚点不再依赖AI自觉）
  const rhythm = getRhythmDirective(getNextTurn(), GameState.character.background);
  // 构造当前回合的上下文消息
  const contextPayload = {
    rhythm_directive: rhythm.directive,
    character_canon: GameState.character.intro
      ? `【角色身世·铁律】以下角色身世小传是玩家开局时确认过的正史设定，任何叙事涉及角色姓名、籍贯、家庭、早年经历、出身时，必须与之严格一致，不得改写、不得新增矛盾设定、不得重新介绍角色身世：\n${GameState.character.intro}`
      : undefined,
    recent_plot: collectRecentPlot(8),
    recent_choices: collectRecentChoices(),
    current_state: {
      turn: GameState.turn,
      year: GameState.year,
      month: GameState.month,
      pacing: GameState.pacing,
      character: {
        name: GameState.character.name,
        age: GameState.character.age,
        background: GameState.character.background,
        position: GameState.character.position,
        rank: GameState.character.rank
      },
      attributes: GameState.attributes,
      factions: GameState.factions,
      emperor_feeling: GameState.emperor_feeling,
      seeds: GameState.seeds,
      seeds_triggered: GameState.seeds_triggered
    },
    // v3.6：动态规则扩展
    dynamic_rules: {
      alive_npcs: getAliveNPCs(GameState.year),
      institutions: getAllowedInstitutions(GameState.year),
      anchor_info: getAnchorHints(getNextTurn()),
      background_anchor_hint: getBackgroundAnchorHint(GameState.character.background, getNextTurn()),
      ending_conditions: getEndingConditions(GameState.character.background),
      path_reminder: getBackgroundPathReminder(GameState.character.background, getNextTurn()),
      surveillance_hint: getSurveillanceHint(GameState.year, getNextTurn(), GameState.character.background)
    },
    player_action: userMessage
  };

  // 把当前玩家行动加入历史
  chatHistory.push({
    role: 'user',
    content: JSON.stringify(contextPayload)
  });

  // 控制历史长度：保留最近 30 条消息（约 15 回合），防止超出上下文窗口
  // 每回合 = 1条 user + 1条 assistant，30条 ≈ 15 回合
  const MAX_HISTORY = 30;
  const trimmedHistory = chatHistory.slice(-MAX_HISTORY);

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 120000); // 120s 超时（flash 模型响应较慢）

  let fullText = '';
  let lastScrollTime = 0;
  let userScrolling = false; // 检测用户是否在主动滚动

  // 监听用户滚动事件
  const scrollHandler = () => {
    userScrolling = true;
  };
  window.addEventListener('wheel', scrollHandler, { passive: true });
  window.addEventListener('touchmove', scrollHandler, { passive: true });

  try {
    const resp = await fetch(BOT_CONFIG.proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: trimmedHistory }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!resp.ok) {
      let errMsg = `服务器错误 (${resp.status})`;
      try {
        const errData = await resp.json();
        errMsg = errData.error || errData.detail || errMsg;
      } catch (_) {}
      throw new Error(errMsg);
    }

    // 读取流式响应
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      fullText += chunk;

      // 实时更新流式显示区域（过滤掉选项和状态数据，只显示叙事部分）
      if (streamTarget) {
        // 检测 --- 分隔符，只显示分隔符之前的叙事文本
        let displayText = fullText;
        const dividerIndex = fullText.indexOf('\n---\n');
        if (dividerIndex !== -1) displayText = fullText.substring(0, dividerIndex);
        // 流式阶段也过滤掉可能出现的 JSON 代码块残影
        displayText = displayText
          .replace(/`{3,4}\s*(?:json)?\s*[\s\S]*?(?:`{3,4}|$)/gi, '')
          .replace(/\{\s*[\s\S]*?(?:\}\s*(?:,?\s*\n|\s*$))/gm, '')
          .trim();
        streamTarget.textContent = displayText;
        // 节流滚动：每 150ms 最多滚一次，避免性能问题；用户主动滚动时暂停自动滚动
        const now = Date.now();
        if (now - lastScrollTime > 150 && !userScrolling) {
          scrollToBottom();
          lastScrollTime = now;
        }
      }
    }

    // 清理滚动监听器
    window.removeEventListener('wheel', scrollHandler);
    window.removeEventListener('touchmove', scrollHandler);

    // 把 AI 回复加入历史
    if (fullText.trim()) {
      chatHistory.push({ role: 'assistant', content: fullText.trim() });
    }

    return fullText;
  } catch (err) {
    clearTimeout(timeoutId);
    // 清理滚动监听器
    window.removeEventListener('wheel', scrollHandler);
    window.removeEventListener('touchmove', scrollHandler);
    // 失败时回滚刚加入的 user 消息
    if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
      chatHistory.pop();
    }
    if (err.name === 'AbortError') {
      throw new Error('请求超时，墨史官似乎陷入了沉思……请重试');
    }
    throw err;
  }
}

// ========== TURN PROCESSOR ==========
async function processAITurn(userChoice) {
  // 前端节奏引擎：本回合目标节奏（在叙事上屏/回合推进前计算，回合号准确）
  const engineRhythm = getRhythmDirective(getNextTurn());
  // 创建流式输出区域
  const streamArea = document.createElement('div');
  streamArea.className = 'stream-area';
  const streamText = document.createElement('div');
  streamText.className = 'stream-text';
  streamText.innerHTML = '<span class="stream-cursor"></span>';
  streamArea.appendChild(streamText);
  gameContainer.appendChild(streamArea);
  scrollToBottom();

  // 流式接收 AI 回复
  let rawOutput;
  try {
    rawOutput = await streamBotAPI(userChoice, streamText);
  } catch (err) {
    console.error('API error:', err);
    streamArea.remove();
    showError(`墨史官执笔踟蹰……（${err.message}）`);
    return;
  }

  // 流式结束，移除流式区域
  streamArea.remove();

  if (!rawOutput || !rawOutput.trim()) {
    showError('墨史官的回复为空，请重试。');
    return;
  }

  // 解析完整输出
  const parsed = parseAIOutput(rawOutput);

  if (!parsed.narrative) {
    showError('墨史官的回复格式有误，请重试。');
    return;
  }

  // 判断是否为驳回（SP v3.1：rejected=true 时数值不变、回合不推进、时间不流逝）
  const isRejected = parsed.stateBlock &&
    (parsed.stateBlock.rejected === true || parsed.stateBlock.rejected === 'true');

  // ===== 时间/回合硬校验（驳回时全部跳过）=====
  let clamped = false; // 本回合是否触发了钳制（若AI时间没推进，视为原地踏步）
  if (parsed.stateBlock && !isRejected) {
    const sb = parsed.stateBlock;
    const gYear = GameState.year, gMonth = GameState.month;
    // turn：只允许等于"即将生成的回合号"（与节奏引擎 getNextTurn 一致：开局为1，之后递增），其余钳制
    const nextTurn = getNextTurn();
    const sbTurn = parseInt(sb.turn, 10);
    GameState.turn = (Number.isFinite(sbTurn) && sbTurn === nextTurn) ? sbTurn : nextTurn;
    // year/month：只许前进不许倒退，上限洪武三十一年(1398)；月份非法则钳
    let y = parseInt(sb.year, 10), m = parseInt(sb.month, 10);
    if (!Number.isFinite(y)) y = gYear;
    if (!Number.isFinite(m) || m < 1 || m > 12) m = gMonth;
    if (y < gYear || (y === gYear && m < gMonth)) { y = gYear; m = gMonth; clamped = true; }
    if (y > 1398) { y = 1398; m = 6; }
    GameState.year = y;
    GameState.month = m;
    // 角色年龄：前端按年份差硬算，不采信AI（开局1375年=baseAge）
    if (!GameState.character.baseAge) GameState.character.baseAge = GameState.character.age || 22;
    GameState.character.age = GameState.character.baseAge + (y - 1375);
  }

  // 回合信息（驳回时不显示新回合标记，因为时间没有推进）
  let finalPacing = engineRhythm.pacing;
  if (parsed.stateBlock && !isRejected) {
    const sb = parsed.stateBlock;
    // 种子引爆例外：AI 自报「反转」而引擎不是反转时，采信 AI（历史锚点节奏仍以引擎为准）
    if (sb.pacing === '反转' && engineRhythm.pacing !== '反转') finalPacing = '反转';
    const yearName = getYearName(GameState.year);
    const monthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
    addTurnInfo(`${yearName} · ${monthNames[GameState.month - 1]}月 · 第${GameState.turn}回`);
    applyPacing(finalPacing);
  }

  // 渲染叙事（驳回时使用特殊样式）
  const narrativeHTML = narrativeToHTML(parsed.narrative);
  const narrativeEl = renderNarrative(narrativeHTML);
  if (isRejected) {
    const textEl = narrativeEl.querySelector('.narrative-text');
    if (textEl) textEl.classList.add('rejected');
  }
  gameContainer.appendChild(narrativeEl);
  scrollToBottom();

  // 应用状态变更（驳回时跳过：不更新数值、不推进回合、不存档）
  if (!isRejected) {
    await new Promise(r => setTimeout(r, 500));
    if (parsed.stateBlock) {
      const sb = parsed.stateBlock;
      // turn/year/month/age 已在前面硬校验钳制，此处不再采信AI
      GameState.pacing = finalPacing; // 节奏硬控：存档/状态面板同步最终判定值（历史锚点引擎为准，种子引爆例外）
      if (sb.character) {
        if (sb.character.position) GameState.character.position = sb.character.position;
        if (sb.character.rank !== undefined) GameState.character.rank = sb.character.rank;
      }
      if (sb.changes) {
        applyChanges(sb.changes);
      }
      autoSave();
    }
  }

  // 结局判定：AI主动给ending，或到达终局硬边界（第60回合 / 年份越过1398）时强制截断
  const atFinaleBoundary = !isRejected && (GameState.turn >= 60 || GameState.year >= 1398);
  if (!isRejected && parsed.stateBlock && parsed.stateBlock.ending) {
    showEnding(parsed.stateBlock.ending, parsed.narrative);
    return;
  }
  if (atFinaleBoundary) {
    showEnding(
      { title: '洪武落幕', description: '洪武三十一年，太祖驾崩。建文帝即位，改元建文。你的洪武仕途在此画上句号——身后功过，留与青史。（未检测到结局结算：AI未能输出结局字段，系统按终局边界强制结束。）' },
      parsed.narrative
    );
    return;
  }

  // 渲染选项（驳回时给出重新选择的提示）
  await new Promise(r => setTimeout(r, isRejected ? 200 : 400));
  // 部分选项修复：解析器提取到了 1-2 个选项时，保留它们并补充默认项到 3 个；
  // 完全没提取到时才回退到默认四项
  const DEFAULT_CHOICES = ['继续前行', '另作打算', '静观其变', '自由行动：（输入你想做的任何事）'];
  let choices;
  if (parsed.choices.length >= 3) {
    choices = parsed.choices;
  } else if (parsed.choices.length >= 1) {
    // 保留 AI 已写出的部分选项，补齐到 3 个
    choices = parsed.choices.slice(0, 3);
    const filler = DEFAULT_CHOICES.slice(0, 3 - choices.length);
    choices = choices.concat(filler);
  } else {
    choices = DEFAULT_CHOICES;
  }

  const choicesArea = renderChoices(choices, (choice) => {
    addDivider();
    // 记录玩家的选择
    const note = document.createElement('div');
    note.className = 'history-choice-made';
    note.textContent = `▸ ${choice}`;
    gameContainer.appendChild(note);
    // 下一回合计发给 AI（驳回后的选择仍然作为新的行动输入）
    processAITurn(choice);
  });

  if (isRejected) {
    choicesArea.classList.add('rejected-hint');
  }

  gameContainer.appendChild(choicesArea);
  scrollToBottom();
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'input-screen';
  div.innerHTML = `
    <h2>墨笔滞涩</h2>
    <p class="subtitle">${msg}</p>
    <button class="confirm-btn" onclick="this.closest('.input-screen').remove();">再 试</button>
  `;
  gameContainer.appendChild(div);
  scrollToBottom();
}

function showEnding(ending, narrative) {
  const div = document.createElement('div');
  div.className = 'input-screen';
  div.innerHTML = `
    <h2>${ending.title || '终章'}</h2>
    <p class="subtitle">${ending.description || '你的故事到此结束。'}</p>
    <button class="confirm-btn" onclick="location.reload()">重新开始</button>
  `;
  gameContainer.appendChild(div);
  scrollToBottom();
}

// ========== MAIN GAME LOOP (supports demo + live) ==========
async function enterGameLoop() {
  clearContainer();

  if (BOT_CONFIG.mode === 'live') {
    // === LIVE MODE ===
    chatHistory = []; // 重置对话历史
    // First turn: send character intro as context
    const initialContext = `【角色创建已完成，跳过第16.3节首轮格式。玩家角色已确定，身世小传玩家已在开局界面读过，即上文 character_canon 字段】

请严格按照第16.1节的输出格式，直接输出第一回合的完整内容：
1. 叙事段落（400-600字·**首回合蒙太奇**）：本回合允许用蒙太奇手法快进"从小传入仕（约洪武初年）到洪武八年春"的数年铺垫。先用 2-3 句话从小传结尾处接续（角色到任/当差），然后用 2-3 句话概括这数年间的关键变化（官职升降/人际聚散/某次危机），最后落点到**洪武八年春**——一个让角色嗅到"太师刘基病重"风声的清晨或午后，窗外有具体可感的场景。可以引用小传中的人物与细节（如父亲遗言、家世处境、舅舅蓝玉），但禁止复述、重写或扩写小传本身，禁止重新介绍角色身世
2. ---分隔符
3. 3个选项+1个自由行动（用「」包裹），围绕"刘基病重"消息的初步反应（打探/观望/拜访等）
4. ---分隔符
5. JSON状态块（turn:1, year:1375, month:3, pacing:紧迫, 数值变化体现数年积累：权势+5~10, 人脉+5~10, 其他可微增；year/month 为蒙太奇结束点，之后进入刘基事件的紧迫窗口）

不要问名字、不要问出身，角色已确定。直接开始叙事。`;

    await processAITurn(initialContext);
  } else {
    // === DEMO MODE ===
    await showLoading(1000);

    for (let i = 0; i < DEMO_TURNS.length; i++) {
      const turn = DEMO_TURNS[i];

      const yearName = getYearName(turn.state.year);
      const monthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
      addTurnInfo(`${yearName} · ${monthNames[turn.state.month - 1]}月 · 第${turn.state.turn}回`);
      applyPacing(turn.state.pacing);

      await showLoading(800 + Math.random() * 600);

      const narrativeHTML = narrativeToHTML(turn.text);
      gameContainer.appendChild(renderNarrative(narrativeHTML));
      scrollToBottom();

      await new Promise(r => setTimeout(r, 600));
      GameState.turn = turn.state.turn;
      GameState.year = turn.state.year;
      GameState.month = turn.state.month;
      if (turn.state.character) {
        GameState.character.position = turn.state.character.position;
        GameState.character.rank = turn.state.character.rank;
      }
      applyChanges(turn.state.changes);
      autoSave();

      await new Promise(r => setTimeout(r, 400));

      if (i === DEMO_TURNS.length - 1) {
        const choicesArea = renderChoices(turn.choices, (choice) => {
          addDivider();
          if (BOT_CONFIG.mode === 'live') {
            processAITurn(choice);
          } else {
            const endDiv = document.createElement('div');
            endDiv.className = 'input-screen';
            endDiv.innerHTML = `
              <h2>演示到此</h2>
              <p class="subtitle">这是一个前端原型的交互演示。<br>在实际游戏中，你的选择会发送给墨史官（AI），<br>由AI生成下一段叙事。<br><br>感谢体验「墨史 · 大明」。</p>
              <button class="confirm-btn" onclick="location.reload()">重新开始</button>
            `;
            gameContainer.appendChild(endDiv);
            scrollToBottom();
          }
        });
        gameContainer.appendChild(choicesArea);
      } else {
        const choicesArea = renderChoices(turn.choices, () => {});
        gameContainer.appendChild(choicesArea);
        await new Promise(r => setTimeout(r, 2000));
        const firstBtn = choicesArea.querySelector('.choice-btn');
        if (firstBtn) firstBtn.click();
        addDivider();
      }

      scrollToBottom();
    }
  }
}

// ========== SAVE / LOAD SYSTEM ==========
const SAVE_KEY = 'moshi_daming_saves';
const AUTOSAVE_KEY = 'moshi_daming_autosave';
const SAVE_VERSION = 1;
let modalMode = 'save'; // 'save' or 'load'

function getSaves() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return [null, null, null];
    const data = JSON.parse(raw);
    return data.slots || [null, null, null];
  } catch (e) {
    return [null, null, null];
  }
}

function writeSaves(slots) {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    version: SAVE_VERSION,
    slots
  }));
}

function getAutoSave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearAutoSave() {
  localStorage.removeItem(AUTOSAVE_KEY);
}

function saveToSlot(slotIndex) {
  try {
    // 若该档位已有存档，先确认覆盖
    const slots = getSaves();
    const existing = slots[slotIndex];
    if (existing && existing.timestamp) {
      const ok = confirm(`第 ${slotIndex + 1} 档已有存档（${formatTime(existing.timestamp)}），是否覆盖？`);
      if (!ok) return;
    }
    // 基本校验：GameState 必须至少有角色名才能存档
    if (!GameState.character.name) {
      alert('角色尚未命名，无法存档');
      return;
    }
    const snapshot = {
      version: SAVE_VERSION,
      timestamp: Date.now(),
      gameState: JSON.parse(JSON.stringify(GameState)),
      narrativeHistory: collectNarrativeHistory()
    };
    slots[slotIndex] = snapshot;
    writeSaves(slots);
    // 重新渲染槽位，覆盖存档后立即刷新显示
    renderModalSlots();

    // 视觉确认：边框闪绿
    const slotEl = document.querySelector(`[data-slot="${slotIndex}"]`);
    if (slotEl) {
      const original = slotEl.style.borderColor;
      const originalShadow = slotEl.style.boxShadow;
      slotEl.style.borderColor = '#27ae60';
      slotEl.style.boxShadow = '0 0 12px rgba(39,174,96,0.25)';
      setTimeout(() => {
        slotEl.style.borderColor = original;
        slotEl.style.boxShadow = originalShadow;
      }, 900);
    }
  } catch (err) {
    console.error('saveToSlot failed:', err);
    alert('存档失败：' + (err.message || err));
  }
}

function loadFromSlot(slotIndex) {
  try {
    const slots = getSaves();
    const save = slots[slotIndex];
    if (!save || !save.gameState) {
      alert('该档位存档损坏或为空');
      return;
    }
    closeModal();
    applySnapshot(save);
    // 读档后立刻同步 autosave，防止下次进入首页加载的是旧自动档
    autoSave();
  } catch (err) {
    console.error('loadFromSlot failed:', err);
    alert('读档失败：' + (err.message || err));
  }
}

function deleteSlot(slotIndex) {
  if (!confirm(`确定删除第 ${slotIndex + 1} 档？此操作不可恢复。`)) return;
  try {
    const slots = getSaves();
    slots[slotIndex] = null;
    writeSaves(slots);
    renderModalSlots();
  } catch (err) {
    console.error('deleteSlot failed:', err);
    alert('删除失败：' + (err.message || err));
  }
}

function collectNarrativeHistory() {
  const blocks = [];
  const children = gameContainer.children;
  for (const child of children) {
    if (child.classList.contains('turn-info')) {
      blocks.push({ type: 'turn-info', text: child.textContent });
    } else if (child.classList.contains('narrative-area')) {
      const textEl = child.querySelector('.narrative-text');
      blocks.push({ type: 'narrative', html: textEl ? textEl.innerHTML : '' });
    } else if (child.classList.contains('ink-divider')) {
      blocks.push({ type: 'divider' });
    }
  }
  return blocks;
}

function formatTime(ts) {
  if (!ts || !isFinite(ts)) return '未知时间';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '未知时间';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderModalSlots() {
  const container = document.getElementById('modalSlots');
  if (!container) return;
  const slots = getSaves();
  let html = '';

  for (let i = 0; i < 3; i++) {
    const save = slots[i];
    // 无存档
    if (!save || !save.gameState) {
      html += `
        <div class="save-slot empty" data-slot="${i}">
          <div class="slot-num" style="text-align:center;margin-bottom:0;">第 ${i + 1} 档 · 空</div>
          ${modalMode === 'save'
            ? `<div class="slot-actions" style="justify-content:center;">
                 <button class="slot-btn" onclick="event.stopPropagation();saveToSlot(${i})">存入此档</button>
               </div>`
            : `<div class="slot-actions" style="justify-content:center;color:var(--ink-faint);font-size:0.9rem;">空档</div>`}
        </div>`;
      continue;
    }
    // 有存档
    const gs = save.gameState;
    const yearName = getYearName(gs.year) || `洪武${gs.year - 1367}年`;
    const charName = (gs.character && gs.character.name) ? gs.character.name : '未命名';
    const charBg = (gs.character && gs.character.background) ? gs.character.background : '—';
    const charPos = (gs.character && gs.character.position) ? gs.character.position : '未入流';
    html += `
      <div class="save-slot" data-slot="${i}">
        <div class="slot-header">
          <span class="slot-num">第 ${i + 1} 档</span>
          <span class="slot-time">${formatTime(save.timestamp)}</span>
        </div>
        <div class="slot-info">
          <span>👤 ${charName}</span>
          <span>🎭 ${charBg}</span><br>
          <span>📅 ${yearName} · 第${gs.turn || '?'}回</span>
          <span>🏷️ ${charPos}</span>
        </div>
        <div class="slot-actions">
          ${modalMode === 'save'
            ? `<button class="slot-btn" onclick="event.stopPropagation();saveToSlot(${i})">覆盖存档</button>`
            : `<button class="slot-btn" onclick="event.stopPropagation();loadFromSlot(${i})">读取进度</button>`}
          <button class="slot-btn danger" onclick="event.stopPropagation();deleteSlot(${i})">删除</button>
        </div>
      </div>`;
  }
  container.innerHTML = html;
}

function openSaveModal() {
  modalMode = 'save';
  document.getElementById('modalTitle').textContent = '存 档';
  document.getElementById('modalSubtitle').textContent = '选择一个档位保存当前进度';
  renderModalSlots();
  document.getElementById('saveModal').classList.add('active');
}

function openLoadModal() {
  modalMode = 'load';
  document.getElementById('modalTitle').textContent = '读 档';
  document.getElementById('modalSubtitle').textContent = '选择一个档位继续游戏';
  renderModalSlots();
  document.getElementById('saveModal').classList.add('active');
}

function closeModal() {
  document.getElementById('saveModal').classList.remove('active');
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('saveModal')) closeModal();
}

function saveSnapshot() {
  return {
    version: SAVE_VERSION,
    timestamp: Date.now(),
    gameState: JSON.parse(JSON.stringify(GameState)),
    narrativeHistory: collectNarrativeHistory()
  };
}

function applySnapshot(save) {
  if (!save || !save.gameState) return;
  const gs = save.gameState;
  // 基础容错：确保 gs 的嵌套对象存在
  if (!gs.character) gs.character = { name: '', age: 22, background: '', position: '未入流', rank: 0 };
  if (!gs.attributes) gs.attributes = { power: 20, people: 30, wisdom: 40, bond: 50, fame: 10 };
  if (!gs.factions) gs.factions = { huaixi: 0, zhedong: 0, donggong: 0, zhuwang: 0, jinchen: 0 };
  if (!Array.isArray(gs.seeds)) gs.seeds = [];
  if (!Array.isArray(gs.seeds_triggered)) gs.seeds_triggered = [];

  // 重置 GameState 再合并（避免上一局的残留字段污染）
  GameState.turn = gs.turn || 1;
  GameState.year = gs.year || 1375;
  GameState.month = gs.month || 1;
  GameState.pacing = gs.pacing || '日常';
  GameState.emperor_feeling = gs.emperor_feeling || 0;

  // 浅层合并嵌套对象
  GameState.character = { ...GameState.character, ...gs.character };
  GameState.attributes = { ...gs.attributes };
  GameState.factions = { ...gs.factions };
  GameState.seeds = [...gs.seeds];
  GameState.seeds_triggered = [...gs.seeds_triggered];

  updateStatusPanel();
  clearContainer();
  if (save.narrativeHistory && save.narrativeHistory.length > 0) {
    for (const block of save.narrativeHistory) {
      if (block.type === 'turn-info') addTurnInfo(block.text);
      else if (block.type === 'narrative') gameContainer.appendChild(renderNarrative(block.html, false));
      else if (block.type === 'divider') addDivider();
    }
    // 添加"继续"按钮，让玩家触发下一回合
    addDivider();
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'choice-btn';
    resumeBtn.textContent = '继续前行';
    resumeBtn.style.margin = '1rem auto';
    resumeBtn.style.display = 'block';
    resumeBtn.style.opacity = '1';
    resumeBtn.style.transform = 'none';
    resumeBtn.style.animation = 'none';
    resumeBtn.addEventListener('click', () => {
      resumeBtn.remove();
      const yearName = getYearName(GameState.year);
      const monthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
      const context = `玩家选择继续。当前状态：第${GameState.turn}回，${yearName}${monthNames[GameState.month-1]}月。请严格依据 character_canon（角色身世铁律）与 recent_plot（前情提要）衔接剧情，生成下一回合的叙事和新选项；身世细节以 character_canon 为准，不得自行改编。`;
      processAITurn(context);
    });
    gameContainer.appendChild(resumeBtn);
    scrollToBottom();
  }
}

// Auto-save after each turn (separate key)
function autoSave() {
  localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(saveSnapshot()));
}

function loadAutoSave() {
  try {
    const save = getAutoSave();
    if (!save || !save.gameState) return false;
    closeModal();
    applySnapshot(save);
    return true;
  } catch (err) {
    console.error('loadAutoSave failed:', err);
    return false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  startGame();
